<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Base foot · SQL</title>
<link rel="icon" href="{{ url_for('static', filename='logo.ico') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* data-workers.com theme: deep navy, brand teal, Inter */
:root{--brand:#2dc4c2;--brand-hover:#26a6a5;--bg:#070b15;--panel:#0f172a;--panel-2:#111a2e;--line:#1e293b;
  --text:#f8fafc;--muted:#94a3b8;--danger:#f87171;--ok:#4ade80;--warn:#fbbf24;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 0%,#111827 0%,var(--bg) 70%) fixed;color:var(--text);
  font:14px/1.45 Inter,-apple-system,sans-serif}
header{display:flex;gap:20px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);
  background:rgba(7,11,21,.75);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header .marque{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
header .marque img{width:32px;height:32px;border-radius:8px}
header h1{font-size:16px;font-weight:800;margin:0;letter-spacing:.2px}header h1 span{color:var(--brand)}
header nav{display:flex;gap:4px}
header nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:500}
header nav a:hover{color:var(--text);background:rgba(255,255,255,.06)}
header nav a.actif{color:var(--bg);background:var(--brand)}
header .maj{color:var(--muted);font-size:12px;margin-left:auto}
main{padding:16px 20px}
a{color:var(--brand)}
button{font:inherit;font-weight:600;background:var(--brand);color:var(--bg);border:0;padding:7px 16px;border-radius:8px;cursor:pointer}
button:hover{background:var(--brand-hover)}
button.second{background:transparent;color:var(--text);border:1px solid var(--line)}
button.second:hover{border-color:var(--brand);color:var(--brand)}
.erreur{background:rgba(248,113,113,.12);border:1px solid var(--danger);color:var(--danger);padding:8px 12px;border-radius:8px;
  white-space:pre-wrap;font:13px var(--mono)}
.info{color:var(--muted);font-size:12px}
.table{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--panel)}
table{border-collapse:collapse;font:12.5px var(--mono);width:max-content;min-width:100%}
th,td{padding:5px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:420px;overflow:hidden;
  text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--panel-2);color:var(--brand);font-weight:600}
tbody tr:hover td{background:rgba(45,196,194,.06)}
td.null{color:var(--muted);font-style:italic}
td.num{text-align:right}
@media (max-width:700px){header .maj{margin-left:0;width:100%}main{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <a class="marque" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Data Workers">
    <h1>Base foot <span>·</span> SQL</h1></a>
  <nav><a href="{{ url_for('index') }}" class="{{ 'actif' if request.endpoint == 'index' }}">Requêtes</a>
    <a href="{{ url_for('pipelines') }}" class="{{ 'actif' if request.endpoint == 'pipelines' }}">Pipelines</a>
    <a href="{{ url_for('deconnexion') }}">Déconnexion</a></nav>
  <span class="maj">lecture seule · copie du {{ maj }}</span>
</header>
<main>{% block contenu %}{% endblock %}</main>
</body></html>
